[project]
name = "mistral-release"
version = "0.1.0"
description = "Rebuild mistral-main from feature branches on a selected upstream base."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
update-mistral-main = "mistral_release.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mistral_release"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
